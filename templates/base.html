<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">
    <!-- Navbar -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 font-bold text-xl tracking-tight">
                <span class="bg-orange-500 text-white px-2.5 py-1 rounded text-sm">{{ site_short_name }}</span>
                <span>{{ site_name }}</span>
            </a>
            <nav class="flex items-center gap-6 text-sm font-medium">
                <a href="{% url 'core:home' %}" class="hover:text-orange-400 transition">Início</a>
                <a href="{% url 'vehicles:list' %}" class="hover:text-orange-400 transition">Estoque</a>
                <a href="{% url 'core:sell_vehicle' %}" class="hover:text-orange-400 transition">Venda seu Carro</a>
                <a href="{% url 'core:about' %}" class="hover:text-orange-400 transition">Sobre</a>
                <a href="/gestao/" class="text-slate-400 hover:text-white transition">Gestão</a>
            </nav>
        </div>
    </header>

    <!-- Conteúdo -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Rodapé -->
    <footer class="bg-slate-900 text-slate-400 text-sm py-6 mt-12">
        <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2">
            <p>&copy; {% now "Y" %} {{ site_name }}. Todos os direitos reservados.</p>
            <p>Recife - PE</p>
        </div>
    </footer>

    {% if whatsapp_number %}
        <a href="https://wa.me/{{ whatsapp_number }}?text=Olá! Vim pelo site da {{ site_name|urlencode }} e gostaria de mais informações."
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Falar com a loja pelo WhatsApp"
           class="fixed bottom-6 right-6 z-50 bg-green-600 hover:bg-green-700 text-white p-4 rounded-full shadow-lg hover:scale-105 transition flex items-center gap-2">
            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824z"/>
            </svg>
            <span class="hidden sm:inline text-sm font-semibold pr-1">WhatsApp</span>
        </a>
    {% endif %}

</body>
</html>
