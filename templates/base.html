<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">
    <!-- Navbar -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 font-bold text-xl tracking-tight">
                <span class="bg-orange-500 text-white px-2.5 py-1 rounded text-sm">{{ site_short_name }}</span>
                <span>{{ site_name }}</span>
            </a>
            <nav class="flex items-center gap-6 text-sm font-medium">
                <a href="/" class="hover:text-orange-400 transition">Início</a>
                <a href="{% url 'vehicles:list' %}" class="hover:text-orange-400 transition">Estoque</a>
                <a href="/gestao/" class="text-slate-400 hover:text-white transition">Gestão</a>
            </nav>
        </div>
    </header>

    <!-- Conteúdo -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Rodapé -->
    <footer class="bg-slate-900 text-slate-400 text-sm py-6 mt-12">
        <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2">
            <p>&copy; {% now "Y" %} {{ site_name }}. Todos os direitos reservados.</p>
            <p>Recife - PE</p>
        </div>
    </footer>
</body>
</html>
